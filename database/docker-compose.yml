# Persistent services

services:
  redis:
    image: redis:7-alpine
    container_name: stock-analysis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_stock_analysis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.9.0
    container_name: stock-analysis-mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=${MLFLOW_DB}
      - MLFLOW_ARTIFACT_ROOT=/mlflow-artifacts
      - GUNICORN_CMD_ARGS=--timeout 300 --workers 2
    volumes:
      - mlflow_artifacts:/mlflow-artifacts
    command: mlflow server --host 0.0.0.0 --port 5000 --allowed-hosts "*" --backend-store-uri ${MLFLOW_DB} --default-artifact-root /mlflow-artifacts --serve-artifacts
  
  prometheus:
    image: prom/prometheus:latest
    container_name: stock-analysis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'  # Fixed: tsdb not tsv
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    container_name: stock-analysis-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - default

volumes:
  redis_stock_analysis_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: stock-analysis-network
