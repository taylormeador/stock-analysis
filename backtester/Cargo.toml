[package]
name = "backtester"
version = "0.1.0"
edition = "2024"

[dependencies]
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"] }
dotenvy = "0.15"
chrono = "0.4"
itertools = "0.14.0"
ordered-float = "5.1.0"
env_logger = "0.11.9"
log = "0.4.29"
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
statrs = "0.18.0"
