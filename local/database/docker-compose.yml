# Persistent services

services:
  postgres:
    image: postgres:15-alpine
    container_name: stock-analysis-postgres
    environment:
      POSTGRES_USER: stock_analysis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stock_analysis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_stock_analysis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_analysis -d stock_analysis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stock-analysis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_stock_analysis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.9.0
    container_name: stock-analysis-mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=${MLFLOW_DB}
      - MLFLOW_ARTIFACT_ROOT=/mlflow-artifacts
    volumes:
      - mlflow_artifacts:/mlflow-artifacts
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri ${MLFLOW_DB} --default-artifact-root /mlflow-artifacts
    depends_on:
      postgres:
        condition: service_healthy


  prometheus:
    image: prom/prometheus:latest
    container_name: stock-analysis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsv-retention.time=30d'
    restart: unless-stopped
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    container_name: stock-analysis-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - default

volumes:
  postgres_stock_analysis_data:
  redis_stock_analysis_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: stock-analysis-network
