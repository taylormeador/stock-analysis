services:
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-analysis-celery:latest
    container_name: stock-analysis-celery-worker
    hostname: stock-analysis-celery-worker
    expose:
      - "9808"
    environment:
      - REDIS_URL=${REDIS_URL}
      - CELERY_METRICS_PORT=${CELERY_METRICS_PORT}
      - STOCK_ANALYSIS_DB=${STOCK_ANALYSIS_DB}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - FRED_API_KEY=${FRED_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./app:/app/app
      - ./data:/data
    command: celery -A app.main worker --loglevel=info -Q celery -E -n %h@${NODE_ID} --prefetch-multiplier=1
    restart: unless-stopped
    profiles: [worker]

  celery-worker-long:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-analysis-celery:latest
    container_name: stock-analysis-celery-worker-long
    hostname: stock-analysis-celery-worker-long
    expose:
      - "9808"
    environment:
      - REDIS_URL=${REDIS_URL}
      - CELERY_METRICS_PORT=${CELERY_METRICS_PORT}
      - STOCK_ANALYSIS_DB=${STOCK_ANALYSIS_DB}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - FRED_API_KEY=${FRED_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./app:/app/app
      - ./data:/data
      - /mnt/srv2-storage/reddit:/mnt/srv2-storage/reddit:ro
    command: celery -A app.main worker --loglevel=info -Q historical -E -n %h@${NODE_ID} --concurrency=4 --prefetch-multiplier=1
    restart: unless-stopped
    profiles: [worker-long]

  celery-worker-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-analysis-celery:latest
    container_name: stock-analysis-celery-worker-gpu
    hostname: stock-analysis-celery-worker-gpu
    expose:
      - "9808"
    environment:
      - REDIS_URL=${REDIS_URL}
      - CELERY_METRICS_PORT=${CELERY_METRICS_PORT}
      - STOCK_ANALYSIS_DB=${STOCK_ANALYSIS_DB}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - FRED_API_KEY=${FRED_API_KEY}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE}
      - EMBEDDING_NUM_BATCHES=${EMBEDDING_NUM_BATCHES}
      - SENTIMENT_BATCH_SIZE=${SENTIMENT_BATCH_SIZE}
      - SENTIMENT_NUM_BATCHES=${SENTIMENT_NUM_BATCHES}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./app:/app/app
      - ./data:/data
    command: celery -A app.main worker --loglevel=info --max-tasks-per-child=10 -Q gpu -E -n %h@${NODE_ID} --concurrency=2 --prefetch-multiplier=1
    restart: unless-stopped
    profiles: [worker-gpu]


  celery-beat:
    image: stock-analysis-celery:latest
    container_name: stock-analysis-celery-beat
    environment:
      - REDIS_URL=${REDIS_URL}
      - CELERY_METRICS_PORT=${CELERY_METRICS_PORT}
      - STOCK_ANALYSIS_DB=${STOCK_ANALYSIS_DB}
      - SENTIMENT_BATCH_SIZE=0
      - SENTIMENT_NUM_BATCHES=0
      - FRED_API_KEY=${FRED_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./app:/app/app
    command: celery -A app.main beat --loglevel=info
    restart: unless-stopped
    profiles: [brain]

  flower:
    image: stock-analysis-celery:latest
    container_name: stock-analysis-flower
    hostname: stock-analysis-flower
    environment:
      - REDIS_URL=${REDIS_URL}
      - CELERY_METRICS_PORT=${CELERY_METRICS_PORT}
      - STOCK_ANALYSIS_DB=${STOCK_ANALYSIS_DB}
      - SENTIMENT_BATCH_SIZE=0
      - SENTIMENT_NUM_BATCHES=0
      - FLOWER_UNAUTHENTICATED_API=${FLOWER_UNAUTHENTICATED_API}
      - FRED_API_KEY=${FRED_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./app:/app/app
    ports:
      - "5555:5555"
    command: celery -A app.main flower --port=5555 --prometheus_metrics
    restart: unless-stopped
    profiles: [brain]

  celery-exporter:
    image: danihodovic/celery-exporter:latest
    container_name: stock-analysis-celery-exporter
    hostname: stock-analysis-celery-exporter
    ports:
      - "9808:9808"
    environment:
      - CE_BROKER_URL=${REDIS_URL}
      - CE_ENABLE_EVENTS=true
    restart: unless-stopped
    profiles: [brain]

  thetadata-terminal:
    image: eclipse-temurin:21-jre
    container_name: thetadata-terminal
    hostname: thetadata-terminal
    working_dir: /app
    volumes:
      - ./thetadata/ThetaTerminalv3.jar:/app/ThetaTerminalv3.jar:ro
      - ./thetadata/creds.txt:/app/creds.txt:ro
    command: java -jar ThetaTerminalv3.jar
    ports:
      - "25503:25503"
    restart: unless-stopped
    profiles: [brain]

networks:
  default:
    name: stock-analysis-network
    external: true